[package]
name = "cabinet-api"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cabinet-api"
path = "src/main.rs"

[dependencies]
# Web framework & async runtime
axum = { version = "0.7.9", features = ["macros", "multipart"] }
tokio = { version = "1.41.0", features = ["full"] }
tower = { version = "0.5.1", features = ["util"] }
tower-http = { version = "0.6.1", features = ["cors", "trace", "compression-gzip", "timeout", "request-id"] }

# Database & SQL
sqlx = { version = "0.8.2", default-features = false, features = [
    "runtime-tokio-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "macros"
] }

# Redis & Caching
redis = { version = "0.27.5", features = ["tokio-comp", "connection-manager", "aio"] }

# Serialization & Models
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
chrono = { version = "0.4.38", features = ["serde"] }
uuid = { version = "1.11.0", features = ["v7", "v4", "serde"] }

# OpenAPI & Swagger UI
utoipa = { version = "4.2.3", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "7.1.0", features = ["axum"] }

# HTTP Client & Scraping
reqwest = { version = "0.12.9", default-features = false, features = ["rustls-tls", "json", "stream"] }
lol_html = "2.1.0"
url = "2.5.2"
urlencoding = "2.1.3"
ipnet = "2.10.1"

# Image processing & Thumbnail WebP
image = { version = "0.25.4", default-features = false, features = ["png", "jpeg", "webp"] }

# Auth & Cryptography
argon2 = { version = "0.5.3", features = ["std"] }
sha2 = "0.10.8"
rand = "0.8.5"
base64 = "0.22.1"
hex = "0.4.3"
hmac = "0.12.1"

# Telemetry & Config
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }
dotenvy = "0.15.7"
thiserror = "1.0.65"
anyhow = "1.0.92"
validator = { version = "0.18.1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
